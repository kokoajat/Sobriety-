name: Deploy to GitHub Pages

# GitHub Pages serves whatever is in the published artifact verbatim; it does not
# build anything. The repo root holds a Vite dev entry that points at
# src/main.tsx, which no browser can execute, so the site has to be built here
# and the built output published instead.
on:
  push:
    branches:
      - main
      - claude/repo-name-idea-ex3373
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build should fail here rather than publish a blank page.
      - run: npm test
      - run: npm run build

      # The site GitHub actually serves is the build committed at the repo root
      # (see README: the Pages source is branch-based and cannot be changed from
      # here). A stale commit would silently serve an old app, so rebuild and
      # fail if the result differs from what is committed.
      - name: Verify committed build is current
        run: |
          if ! git diff --exit-code -- index.html assets; then
            echo "::error::Repon juuren kaannos on vanhentunut. Aja 'npm run build' ja committaa index.html + assets/."
            exit 1
          fi

      # enablement turns Pages on when it is off. It does NOT change the source
      # of a repo where Pages is already enabled — that is a repository setting
      # (Settings > Pages > Source: GitHub Actions), and until it is set to
      # Actions the legacy branch builder keeps running in parallel and
      # republishes the repo root over whatever this job deploys.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
